<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Исследование забытых имен XVIII века</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f4ecd8;
    --ink: #2c1e16;
    --ink-light: #5c4a3d;
    --gold: #b8860b;
    --accent: #8b0000;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    background-color: #1a110a;
    /* Текстура дерева/кожи для фона */
    background-image: url('https://www.transparenttextures.com/patterns/black-paper.png');
    font-family: 'Lora', serif;
    color: var(--ink);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  /* Контейнер книги */
  .book-container {
    width: 90vw;
    max-width: 900px;
    height: 85vh;
    max-height: 800px;
    background-color: var(--paper);
    /* Текстура пергамента */
    background-image: 
      url('https://www.transparenttextures.com/patterns/cream-paper.png'),
      radial-gradient(circle at 50% 50%, rgba(255,255,255,0.4) 0%, rgba(200,180,150,0.4) 100%);
    box-shadow: 
      inset 0 0 50px rgba(139, 69, 19, 0.2),
      0 20px 50px rgba(0,0,0,0.8),
      10px 10px 0 -5px #e8dcc4,
      10px 10px 0 0 #c9b590;
    border-radius: 5px;
    border: 1px solid #d3be9b;
    position: relative;
    display: flex;
    flex-direction: column;
    padding: 40px 50px;
    transition: transform 0.3s;
  }

  /* Декоративные уголки */
  .corner { position: absolute; width: 40px; height: 40px; border: 2px solid var(--gold); opacity: 0.6; }
  .corner-tl { top: 15px; left: 15px; border-right: none; border-bottom: none; }
  .corner-tr { top: 15px; right: 15px; border-left: none; border-bottom: none; }
  .corner-bl { bottom: 15px; left: 15px; border-right: none; border-top: none; }
  .corner-br { bottom: 15px; right: 15px; border-left: none; border-top: none; }

  /* Шапка */
  .header { text-align: center; border-bottom: 2px solid var(--gold); padding-bottom: 15px; margin-bottom: 20px; }
  .header h1 { font-family: 'Playfair Display', serif; font-size: 1.8rem; color: var(--accent); letter-spacing: 1px; }
  .header p { font-size: 0.9rem; color: var(--ink-light); font-style: italic; margin-top: 5px; }

  /* Контент */
  .content { flex-grow: 1; overflow-y: auto; padding-right: 15px; scroll-behavior: smooth; }
  
  /* Кастомный скроллбар */
  .content::-webkit-scrollbar { width: 8px; }
  .content::-webkit-scrollbar-track { background: rgba(0,0,0,0.05); border-radius: 4px; }
  .content::-webkit-scrollbar-thumb { background: #c9b590; border-radius: 4px; }
  .content::-webkit-scrollbar-thumb:hover { background: var(--gold); }

  /* Секции */
  .section { margin-bottom: 30px; animation: fadeIn 0.8s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  
  .section h2 { font-family: 'Playfair Display', serif; font-size: 1.4rem; color: var(--accent); margin-bottom: 10px; border-left: 3px solid var(--gold); padding-left: 10px; }
  .section p { font-size: 1rem; line-height: 1.7; text-align: justify; margin-bottom: 10px; color: var(--ink); }
  
  /* Списки */
  .section ul { margin-left: 20px; margin-bottom: 15px; font-size: 1rem; line-height: 1.7; }
  .section li { margin-bottom: 8px; }
  .section li::marker { color: var(--gold); font-weight: bold; }

  /* Выделение имен */
  .name-highlight {
    color: var(--accent);
    font-weight: bold;
    cursor: pointer;
    border-bottom: 1px dashed var(--accent);
    transition: all 0.2s;
    position: relative;
  }
  .name-highlight:hover { color: var(--gold); border-bottom-color: var(--gold); }

  /* Блок с целями */
  .goal-box {
    background: rgba(184, 134, 11, 0.08);
    border: 1px solid rgba(184, 134, 11, 0.3);
    padding: 15px;
    border-radius: 5px;
    margin-bottom: 15px;
    font-style: italic;
  }

  /* Навигация внизу */
  .nav-controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 15px;
    border-top: 1px solid rgba(184, 134, 11, 0.4);
    margin-top: 10px;
  }
  .nav-btn {
    background: transparent;
    border: 1px solid var(--gold);
    color: var(--ink);
    font-family: 'Playfair Display', serif;
    font-size: 1rem;
    padding: 8px 20px;
    cursor: pointer;
    transition: all 0.3s;
    border-radius: 3px;
  }
  .nav-btn:hover { background: var(--gold); color: #fff; box-shadow: 0 0 10px rgba(184,134,11,0.4); }
  .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  
  .page-indicator { font-family: 'Playfair Display', serif; font-size: 1.1rem; color: var(--ink-light); }

  /* Мобильная адаптация */
  @media (max-width: 768px) {
    .book-container { padding: 20px; height: 95vh; width: 95vw; }
    .header h1 { font-size: 1.3rem; }
    .section h2 { font-size: 1.2rem; }
    .section p, .section ul { font-size: 0.95rem; }
    .nav-btn { padding: 6px 12px; font-size: 0.9rem; }
  }
</style>
</head>
<body>

<div class="book-container">
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <div class="header">
    <h1 id="page-title">Титульный лист</h1>
    <p>Исследовательский проект • 9 класс</p>
  </div>

  <div class="content" id="content-box">
    <!-- Сюда JS будет вставлять текст -->
  </div>

  <div class="nav-controls">
    <button class="nav-btn" id="prevBtn" onclick="prevPage()">← Назад</button>
    <span class="page-indicator" id="page-indicator">1 / 8</span>
    <button class="nav-btn" id="nextBtn" onclick="nextPage()">Далее →</button>
  </div>
</div>

<script>
  // ТВОЙ ТЕКСТ, РАЗБИТЫЙ НА СТРАНИЦЫ
  const pages = [
    {
      title: "Титульный лист",
      html: `
        <div class="section" style="text-align: center; margin-top: 40px;">
          <p style="font-size: 1.2rem; margin-bottom: 20px;">Средняя общеобразовательная школа № 4</p>
          <h2 style="border: none; font-size: 2rem; padding: 0;">ПРОЕКТ</h2>
          <p style="font-size: 1.1rem; margin-bottom: 10px;">на тему</p>
          <p style="font-size: 1.3rem; font-weight: bold; margin-bottom: 40px;">«Исследование забытых имен и литературных сообществ русской литературы XVIII века»</p>
          
          <div style="text-align: right; margin-top: 50px;">
            <p><strong>Выполнила:</strong></p>
            <p>ученица 9 «Б» класса</p>
            <p>Сухова Василиса Никитична</p>
            <br>
            <p><strong>Руководитель:</strong></p>
            <p>Величкова Елена Ивановна</p>
          </div>
          
          <p style="margin-top: 80px;">Шелехов 2026 г.</p>
        </div>
      `
    },
    {
      title: "Введение",
      html: `
        <div class="section">
          <h2>Проблема</h2>
          <p>Недостаточная изученность и популяризация забытых писателей XVIII века и малоизвестных литературных сообществ мешают полноте понимания исторического развития русской литературы.</p>
          
          <div class="goal-box">
            <h2 style="border: none; padding: 0; font-size: 1.2rem; margin-bottom: 10px;">Цель</h2>
            <p>Создать комплексное научно-исследовательское изложение о забытых писателях и литературных сообществах XVIII века, способствующее развитию филологической науки и расширению знаний об истории русской литературы.</p>
          </div>

          <h2>Задачи</h2>
          <ul>
            <li>Изучить учебную литературу по истории русской литературы XVIII века;</li>
            <li>Проанализировать архивные материалы Пушкинского Дома и других институтов;</li>
            <li>Выявить и классифицировать забытые имена авторов;</li>
            <li>Исследовать организацию и функции литературных сообществ того времени;</li>
            <li>Составить научный обзор с новыми выводами;</li>
            <li>Подготовить содержательный буклет для широкой аудитории.</li>
          </ul>
        </div>
        <div class="section">
          <h2>Введение</h2>
          <p>Русская литература XVIII века хранит множество забытых авторов, чьи произведения почти не исследованы из-за исторических и источниковых ограничений. Изучение этих фигур расширяет понимание культуры эпохи и разнообразия жанров. Работа восполняет пробелы в истории, раскрывая малые сообщества и малоизвестных писателей, а также анализирует их вклад и связь с крупными литературными процессами.</p>
        </div>
      `
    },
    {
      title: "Контекст эпохи",
      html: `
        <div class="section">
          <h2>Исторический контекст русской литературы XVIII века</h2>
          <p>XVIII век в России ознаменовался реформами Петра I, ростом просвещённого чиновничества и распространением идей Просвещения. Литература стала инструментом национального самосознания и социального диалога. Развитие образования, типографии и периодики расширило аудиторию, а формирование русского литературного языка содействовало разнообразию жанров и стилевых направлений, отражающих культурные и политические изменения эпохи.</p>
        </div>
        <div class="section">
          <h2>Литературные сообщества XVIII века: структура и функции</h2>
          <p>Литературные сообщества XVIII века были центрами обмена идеями и творческой поддержки, объединяя авторов для обсуждения языка и жанров. Их структура была неформальной, основываясь на интересах и связях. Примеры: Дружеское литературное общество и «Арзамас». Они способствовали обновлению языка, поддержке талантов и развитию литературных традиций, формируя мост к более организованным сообществам XIX века.</p>
        </div>
      `
    },
    {
      title: "Забытые имена",
      html: `
        <div class="section">
          <h2>Забытые имена в истории русской литературы XVIII века</h2>
          <p>Многие писатели XVIII века забыты из-за ограниченного распространения и смены литературных вкусов. Это осложняет понимание развития жанров и стилей эпохи. Словарь русских писателей XVIII века (2010) расширил представление о малоизвестных авторах, таких как <span class="name-highlight" onclick="showName('Алексей Маслов', 'Русский писатель и переводчик XVIII века. Его творчество долгое время оставалось в тени, но современные исследования раскрывают его вклад в развитие литературного языка.')">Алексей Маслов</span> и <span class="name-highlight" onclick="showName('Яков де Санглен', 'Личность яркая и неоднозначная. Литератор, переводчик и государственный деятель, чьи работы отражают сложные культурные и политические процессы эпохи.')">Яков де Санглен</span>.</p>
          <p>Их творчество и биографии раскрывают глубину и разнообразие литературной жизни, влияя на пересмотр историко-литературного контекста.</p>
          <p style="font-style: italic; color: var(--ink-light); margin-top: 15px;">* Нажмите на имена, выделенные красным, чтобы узнать больше.</p>
        </div>
      `
    },
    {
      title: "Методология",
      html: `
        <div class="section">
          <h2>Методика исследования забытых авторов</h2>
          <p>Метод основан на междисциплинарном подходе филологии, объединяющем языкознание, историю и культурологию. Важна архивная работа с рукописями и лингвистический анализ с помощью корпусных методов. Используется сравнительный анализ стилей и изучение учебных материалов. Электронные ресурсы повышают качество и интерактивность исследований, обеспечивая комплексное понимание литературных сообществ XVIII века.</p>
        </div>
        <div class="section">
          <h2>Методы исследования</h2>
          <p>Для комплексного изучения литературных явлений используются:</p>
          <ul>
            <li>Сравнительно-исторический метод;</li>
            <li>Описательный метод;</li>
            <li>Структурно-грамматический метод.</li>
          </ul>
        </div>
      `
    },
    {
      title: "Пушкинский Дом",
      html: `
        <div class="section">
          <h2>Роль Пушкинского Дома</h2>
          <p>В 1934 году в Пушкинском Доме создана группа по изучению русской литературы XVIII века, впервые системно объединяющая исследователей. Под руководством Г. А. Гуковского сформирована современная научная школа с комплексным подходом к эпохе. Регулярные семинары, коллективные публикации и сотрудничество с другими институтами укрепляют позицию Пушкинского Дома как ведущего центра в этой области.</p>
        </div>
        <div class="section">
          <h2>Культурное значение</h2>
          <p>Забытые писатели и литературные сообщества XVIII века значимо влияли на развитие русской культуры, создавая многообразие жанров и стилей. Их клубы способствовали интеллектуальному обмену, адаптации европейских идей и формированию национального литературного вкуса. Эти сообщества играли важную роль в просвещении и становлении интеллигенции, прокладывая путь к золотому веку русской литературы.</p>
        </div>
      `
    },
    {
      title: "Современные подходы",
      html: `
        <div class="section">
          <h2>Восстановление исторической памяти</h2>
          <p>Исследователи используют QR-коды, сторителлинг и игровые форматы для популяризации русской литературы XVIII века. Традиционные выставки стали интерактивными с яркими цитатами и мультимедийными программами. Электронные базы и онлайн-архивы обеспечивают доступ и поддерживают международное сотрудничество. Цифровые технологии и образование расширяют аудиторию и укрепляют читательскую культуру.</p>
        </div>
        <div class="section">
          <h2>Практические рекомендации</h2>
          <p>Включение тем забытых авторов XVIII века обогащает литературный канон и формирует критическое мышление у студентов. Рекомендуется разработка методических пособий с биографией, анализом и практикой. Эффективно использовать сравнения с классиками, риторические упражнения и междисциплинарные проекты. Важно внедрять цифровые технологии и активизировать подготовку методистов для сохранения и продвижения литературного наследия.</p>
        </div>
      `
    },
    {
      title: "Заключение",
      html: `
        <div class="section">
          <h2>Заключение</h2>
          <p>Исследование выявило важность забытых авторов и литературных сообществ XVIII века для развития русской литературы и культуры. Они разнообразили жанры, расширили темы и формировали традиции. Литературные объединения служили центрами обмена идеями и связью с европейским просвещением. Методологический комплекс и роль Пушкинского Дома усиливают научный подход. Практические рекомендации открывают новые пути интеграции наследия в образование и культуру.</p>
        </div>
        <div class="section">
          <h2>Библиография</h2>
          <p>Основные источники исследования включают электронные ресурсы, научные статьи и сборники, посвящённые забытым писателям и литературным обществам XVIII века. Среди них: архивы 18vek.spb.ru, работы К.А. Жульковой, статьи и материалы из Пушкинского дома, а также онлайн-энциклопедии и специализированные порталы по русской литературе XVIII века.</p>
        </div>
        <div style="text-align: center; margin-top: 40px;">
          <h1 style="font-family: 'Playfair Display'; color: var(--accent); font-size: 2rem;">Спасибо за внимание!</h1>
        </div>
      `
    }
  ];

  let currentPage = 0;
  const contentBox = document.getElementById('content-box');
  const pageTitle = document.getElementById('page-title');
  const pageIndicator = document.getElementById('page-indicator');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');

  function renderPage() {
    contentBox.innerHTML = pages[currentPage].html;
    contentBox.scrollTop = 0; // Скролл вверх при смене страницы
    pageTitle.innerText = pages[currentPage].title;
    pageIndicator.innerText = `${currentPage + 1} / ${pages.length}`;
    
    // Блокировка кнопок
    prevBtn.disabled = currentPage === 0;
    nextBtn.disabled = currentPage === pages.length - 1;
  }

  function nextPage() {
    if (currentPage < pages.length - 1) {
      currentPage++;
      renderPage();
    }
  }

  function prevPage() {
    if (currentPage > 0) {
      currentPage--;
      renderPage();
    }
  }

  // Всплывающее окно для имен
  function showName(title, text) {
    // Создаем оверлей
    const overlay = document.createElement('div');
    overlay.style.cssText = `
      position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1000;
      display: flex; justify-content: center; align-items: center; opacity: 0; transition: opacity 0.3s;
    `;
    
    const modal = document.createElement('div');
    modal.style.cssText = `
      background: var(--paper); padding: 30px; border-radius: 5px; max-width: 400px; width: 90%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 2px solid var(--gold);
      transform: scale(0.9); transition: transform 0.3s; text-align: center;
    `;
    
    modal.innerHTML = `
      <h2 style="font-family: 'Playfair Display'; color: var(--accent); margin-bottom: 15px;">${title}</h2>
      <p style="font-family: 'Lora'; font-size: 1rem; line-height: 1.6; color: var(--ink); margin-bottom: 20px;">${text}</p>
      <button style="background: var(--gold); color: #fff; border: none; padding: 10px 20px; font-family: 'Playfair Display'; cursor: pointer; border-radius: 3px;" onclick="this.closest('div').parentElement.remove()">Закрыть</button>
    `;
    
    overlay.appendChild(modal);
    document.body.appendChild(overlay);
    
    // Анимация появления
    requestAnimationFrame(() => {
      overlay.style.opacity = '1';
      modal.style.transform = 'scale(1)';
    });
  }

  // Инициализация
  renderPage();
</script>
</body>
</html>
