<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ловец звезд ✨</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { height: 100vh; overflow: hidden; background: #0a0510; font-family: 'Georgia', serif; touch-action: none; }
  canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; display: block; z-index: 1; }
  
  .hint { position: fixed; top: 8%; left: 0; right: 0; text-align: center; color: #fff; font-size: 18px; letter-spacing: 1px; text-shadow: 0 0 15px #ff9ec7; z-index: 5; pointer-events: none; transition: opacity 0.5s; }
  .score { position: fixed; top: 12%; left: 0; right: 0; text-align: center; color: #ff9ec7; font-size: 28px; font-weight: bold; z-index: 5; pointer-events: none; text-shadow: 0 0 20px #ff9ec7; transition: opacity 0.5s; }
  
  .card { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.5); width: min(520px, 90vw); background: rgba(30, 14, 24, 0.85); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border: 1px solid rgba(255,150,200,0.4); border-radius: 30px; padding: 40px 30px 30px; text-align: center; color: #f5d7e4; box-shadow: 0 30px 100px rgba(255,80,160,0.4), inset 0 0 20px rgba(255,150,200,0.1); z-index: 10; opacity: 0; pointer-events: none; transition: all 1s cubic-bezier(0.2,0.9,0.3,1.2); }
  .card.show { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
  
  .card h1 { font-size: 32px; color: #ffa9cf; margin: 0 0 20px; text-shadow: 0 0 20px rgba(255,120,180,0.8); }
  .card p { font-size: 17px; line-height: 1.7; color: #ecc9d9; margin-bottom: 15px; min-height: 25px; }
  .card .accent { color: #ff9ec7; font-weight: bold; }
  .card .signature { margin-top: 15px; font-style: italic; color: #c98aa6; margin-bottom: 25px; }
  
  .form-container { display: none; flex-direction: column; gap: 12px; margin-top: 15px; opacity: 0; transition: opacity 1s; }
  .form-container.show { opacity: 1; }
  .form-container input { width: 100%; padding: 16px; border-radius: 15px; border: 1px solid rgba(255,150,200,0.4); background: rgba(255,255,255,0.05); color: #fff; font-size: 16px; font-family: 'Georgia', serif; outline: none; transition: border 0.3s; }
  .form-container input:focus { border-color: #ff9ec7; }
  .form-container input::placeholder { color: #d99ab8; }
  .form-container button { padding: 16px; border-radius: 15px; background: linear-gradient(90deg, #ff6eb4, #ff9ec7); border: none; color: #fff; font-size: 18px; font-weight: bold; cursor: pointer; transition: transform 0.2s; box-shadow: 0 10px 20px rgba(255,110,180,0.3); }
  .form-container button:active { transform: scale(0.95); }
  
  .success-msg { display: none; color: #ffd700; font-size: 18px; margin-top: 15px; font-weight: bold; text-shadow: 0 0 15px rgba(255,215,0,0.6); opacity: 0; transition: opacity 0.5s; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint" id="hint">Поймай 5 звезд ✨<br><span style="font-size:14px; opacity:0.7">(последняя будет золотой!)</span></div>
<div class="score" id="score"></div>

<div class="card" id="card">
  <h1 id="cardTitle"></h1>
  <p id="text1"></p>
  <p id="text2"></p>
  <p id="text3"></p>
  <p class="signature" id="signature"></p>
  
  <div class="form-container" id="formBox">
    <input type="text" id="userAnswer" placeholder="Напиши, что ты чувствуешь...">
    <button id="sendBtn">Отправить мне 💌</button>
  </div>
  <div class="success-msg" id="successMsg">Твой ответ улетел ко мне! 🚀</div>
</div>

<script>
const TELEGRAM_TOKEN = '9041834319:AAEcUd2r3B7z67wuHapvp-K36EOVVAeZJLQ'; // Твой токен
const CHAT_ID = '5392706280'; // Твой chat id

window.addEventListener('load', () => {
    const canvas = document.getElementById('c'); const ctx = canvas.getContext('2d');
    let W, H, DPR = Math.min(window.devicePixelRatio || 1, 2);
    let audioCtx;
    
    function playSound(freq, type = 'sine', duration = 0.5) {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(freq * 1.2, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + duration);
        } catch(e) {}
    }

    let stars = [], particles = [], sparks = [], bgStars = [];
    let caught = 0, target = 5, gameOver = false, shakeIntensity = 0;
    let caughtPositions = []; // Для созвездия

    function drawStarShape(ctx, cx, cy, spikes, outerRadius, innerRadius, color, glow) {
        let rot = Math.PI / 2 * 3; let x = cx; let y = cy; let step = Math.PI / spikes;
        ctx.beginPath(); ctx.moveTo(cx, cy - outerRadius);
        for (let i = 0; i < spikes; i++) {
            x = cx + Math.cos(rot) * outerRadius; y = cy + Math.sin(rot) * outerRadius;
            ctx.lineTo(x, y); rot += step;
            x = cx + Math.cos(rot) * innerRadius; y = cy + Math.sin(rot) * innerRadius;
            ctx.lineTo(x, y); rot += step;
        }
        ctx.lineTo(cx, cy - outerRadius); ctx.closePath();
        ctx.fillStyle = color;
        if (glow) { ctx.shadowBlur = glow; ctx.shadowColor = color; }
        ctx.fill(); ctx.shadowBlur = 0;
    }

    function init() {
        W = window.innerWidth; H = window.innerHeight; canvas.width = W * DPR; canvas.height = H * DPR;
        canvas.style.width = W + 'px'; canvas.style.height = H + 'px'; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        stars = []; particles = []; sparks = []; caughtPositions = []; caught = 0; gameOver = false; shakeIntensity = 0;
        
        document.getElementById('score').innerText = `0 / ${target}`; document.getElementById('score').style.opacity = '1';
        document.getElementById('hint').style.opacity = '1'; document.getElementById('card').classList.remove('show');
        document.getElementById('formBox').classList.remove('show');
        document.getElementById('successMsg').style.opacity = '0';
        
        // Очищаем текст карточки перед новой игрой
        ['cardTitle','text1','text2','text3','signature'].forEach(id => document.getElementById(id).innerText = '');

        let padX = W * 0.15; let padY = H * 0.15;
        for (let i = 0; i < target; i++) {
            let isGold = (i === target - 1);
            stars.push({ 
                x: padX + Math.random() * (W - padX * 2), y: padY + Math.random() * (H - padY * 2),
                vx: (Math.random() - 0.5) * (isGold ? 7 : 3.5), vy: (Math.random() - 0.5) * (isGold ? 7 : 3.5),
                size: isGold ? 35 : 20, active: true, isGold: isGold, angle: Math.random() * Math.PI * 2
            });
        }
        bgStars = []; for (let i = 0; i < 100; i++) bgStars.push({ x: Math.random() * W, y: Math.random() * H, s: Math.random() * 2 + 0.5 });
    }

    // Трейл из звездной пыли за пальцем
    canvas.addEventListener('pointermove', (e) => {
        if (gameOver) return;
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left, y = e.clientY - rect.top;
        if (Math.random() > 0.5) {
            sparks.push({ x, y, vx: (Math.random() - 0.5) * 2, vy: (Math.random() - 0.5) * 2, life: 1, size: Math.random() * 3 + 1 });
        }
    });

    canvas.addEventListener('pointerdown', (e) => {
        if (gameOver) return;
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        const rect = canvas.getBoundingClientRect(); const clickX = e.clientX - rect.left, clickY = e.clientY - rect.top;
        for (let i = stars.length - 1; i >= 0; i--) {
            let s = stars[i]; if (!s.active) continue;
            const dist = Math.hypot(clickX - s.x, clickY - s.y);
            if (dist < s.size + 50) {
                s.active = false; caught++;
                caughtPositions.push({x: s.x, y: s.y}); // Запоминаем место для созвездия
                
                if (s.isGold) { 
                    [500, 700, 900, 1100].forEach(f => playSound(f, 'triangle', 1.5)); 
                    shakeIntensity = 40; 
                    for (let p = 0; p < 200; p++) { 
                        particles.push({ x: s.x, y: s.y, vx: (Math.random() - 0.5) * 60, vy: (Math.random() - 0.5) * 60, life: 2.5, color: ['#ffd700', '#fff', '#ff9ec7', '#ff0'][Math.floor(Math.random()*4)] }); 
                    }
                } else { 
                    playSound(500 + caught * 150); shakeIntensity = 15; 
                    for (let p = 0; p < 40; p++) { 
                        particles.push({ x: s.x, y: s.y, vx: (Math.random() - 0.5) * 20, vy: (Math.random() - 0.5) * 20, life: 1.5, color: '#ff9ec7' }); 
                    }
                }
                document.getElementById('score').innerText = `${caught} / ${target}`; 
                if (caught >= target) winGame(); 
                break;
            }
        }
    });

    // Эффект печатной машинки
    function typeWriter(text, elementId, speed, callback) {
        let i = 0;
        document.getElementById(elementId).innerHTML = '';
        function type() {
            if (i < text.length) {
                document.getElementById(elementId).innerHTML += text.charAt(i);
                i++;
                setTimeout(type, speed);
            } else if (callback) {
                callback();
            }
        }
        type();
    }

    function winGame() {
        gameOver = true;
        setTimeout(() => {
            document.getElementById('hint').style.opacity = '0'; 
            document.getElementById('score').style.opacity = '0'; 
            setTimeout(() => { 
                document.getElementById('card').classList.add('show'); 
                // Запускаем печать текста
                typeWriter("Солнце ☀️", "cardTitle", 80, () => {
                    typeWriter("Ты поймала все звезды на этом небе.", "text1", 40, () => {
                        typeWriter("Но знаешь что? <span class='accent'>Самая яркая звезда в моей жизни — это ты.</span>", "text2", 40, () => {
                            typeWriter("Я тебя очень сильно люблю.", "text3", 50, () => {
                                typeWriter("— твой, целиком и полностью", "signature", 50, () => {
                                    document.getElementById('formBox').style.display = 'flex';
                                    setTimeout(() => document.getElementById('formBox').classList.add('show'), 100);
                                });
                            });
                        });
                    });
                });
            }, 1000);
        }, 500);
    }

    document.getElementById('sendBtn').addEventListener('click', () => {
        const text = document.getElementById('userAnswer').value.trim();
        if (!text) return;
        const btn = document.getElementById('sendBtn'); btn.innerText = "Отправляю..."; btn.disabled = true;

        if (TELEGRAM_TOKEN === '9041834319:AAEcUd2r3B7z67wuHapvp-K36EOVVAeZJLQ') {
            setTimeout(() => { showSuccess(); }, 1000); return;
        }

        fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: CHAT_ID, text: `☀️ Солнце ответило на открытку:\n\n"${text}"` })
        }).then(() => showSuccess()).catch(() => { btn.innerText = "Ошибка( Попробуй еще"; btn.disabled = false; });
    });

    function showSuccess() {
        document.getElementById('formBox').style.display = 'none';
        const msg = document.getElementById('successMsg');
        msg.style.display = 'block'; setTimeout(() => msg.style.opacity = '1', 50);
        playSound(800, 'sine', 1); setTimeout(() => playSound(1000, 'sine', 1), 150);
    }

    function update() {
        if (shakeIntensity > 0) shakeIntensity *= 0.9; if (shakeIntensity < 0.5) shakeIntensity = 0;
        for (let s of stars) { 
            if (!s.active) continue; s.x += s.vx; s.y += s.vy; s.angle += 0.02; 
            if (s.x < s.size || s.x > W - s.size) s.vx *= -1; if (s.y < s.size || s.y > H - s.size) s.vy *= -1; 
        }
        for (let i = particles.length - 1; i >= 0; i--) { 
            let p = particles[i]; p.x += p.vx; p.y += p.vy; p.vx *= 0.96; p.vy *= 0.96; p.life -= 0.015; 
            if (p.life <= 0) particles.splice(i, 1); 
        }
        for (let i = sparks.length - 1; i >= 0; i--) {
            let s = sparks[i]; s.x += s.vx; s.y += s.vy; s.life -= 0.05;
            if (s.life <= 0) sparks.splice(i, 1);
        }
    }

    function render() {
        ctx.fillStyle = 'rgba(10, 5, 16, 0.4)'; ctx.fillRect(0, 0, W, H);
        ctx.save(); 
        if (shakeIntensity > 0) { ctx.translate((Math.random() - 0.5) * shakeIntensity, (Math.random() - 0.5) * shakeIntensity); }
        
        // Живая туманность (Nebula) на фоне
        let time = performance.now() * 0.0005;
        let nebulaX = W/2 + Math.sin(time) * 50;
        let nebulaY = H/2 + Math.cos(time) * 50;
        let nebGrd = ctx.createRadialGradient(nebulaX, nebulaY, 0, nebulaX, nebulaY, Math.max(W,H) * 0.6);
        nebGrd.addColorStop(0, 'rgba(60, 20, 50, 0.4)');
        nebGrd.addColorStop(0.5, 'rgba(30, 10, 25, 0.2)');
        nebGrd.addColorStop(1, 'transparent');
        ctx.fillStyle = nebGrd; ctx.fillRect(0,0,W,H);

        ctx.fillStyle = '#ff9ec7';
        for (let b of bgStars) { ctx.globalAlpha = Math.max(0.1, Math.sin(performance.now() * 0.001 + b.x) * 0.5 + 0.5); ctx.beginPath(); ctx.arc(b.x, b.y, b.s, 0, Math.PI * 2); ctx.fill(); }
        ctx.globalAlpha = 1;
        
        // Рисуем пыль от пальца
        for (let s of sparks) {
            ctx.globalAlpha = s.life;
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2); ctx.fill();
        }
        ctx.globalAlpha = 1;

        // Рисуем созвездие (если игра выиграна)
        if (gameOver && caughtPositions.length > 0) {
            ctx.strokeStyle = 'rgba(255, 158, 199, 0.3)'; ctx.lineWidth = 2;
            ctx.beginPath();
            if(caughtPositions[0]) ctx.moveTo(caughtPositions[0].x, caughtPositions[0].y);
            for(let i=1; i<caughtPositions.length; i++) {
                if(caughtPositions[i]) ctx.lineTo(caughtPositions[i].x, caughtPositions[i].y);
            }
            ctx.stroke();
            // Точки созвездия
            for(let pos of caughtPositions) {
                ctx.fillStyle = '#ff9ec7'; ctx.beginPath(); ctx.arc(pos.x, pos.y, 4, 0, Math.PI*2); ctx.fill();
                ctx.shadowBlur = 20; ctx.shadowColor = '#ff9ec7'; ctx.fill(); ctx.shadowBlur = 0;
            }
        }
        
        for (let s of stars) {
            if (!s.active) continue;
            const pulse = 1 + Math.sin(performance.now() * 0.005) * 0.1;
            const r = s.size * pulse;
            ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.angle);
            ctx.beginPath(); ctx.arc(0, 0, r * 2.5, 0, Math.PI * 2);
            let grd = ctx.createRadialGradient(0,0,0, 0,0,r*2.5);
            grd.addColorStop(0, s.isGold ? 'rgba(255,215,0,0.5)' : 'rgba(255,158,199,0.5)'); grd.addColorStop(1, 'transparent');
            ctx.fillStyle = grd; ctx.fill();
            drawStarShape(ctx, 0, 0, 5, r, r * 0.4, s.isGold ? '#ffd700' : '#fff', 15);
            ctx.restore();
        }
        
        for (let p of particles) { 
            ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.color; 
            ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI * 2); ctx.fill(); 
        }
        ctx.globalAlpha = 1; ctx.restore();
    }

    function loop() { requestAnimationFrame(loop); update(); render(); }
    window.addEventListener('resize', init); init(); loop();
});
</script>
</body>
</html>
